<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Plant Life Care - Secure Device QR</title><link rel="stylesheet" href="./styles.css"></head><body><main class="page"><section class="auth-shell"><div class="auth-card"><p class="eyebrow">Plant Life Care V3</p><h1>Secure Device QR</h1><p class="subtitle">Factory tool. Generates a 15-minute, one-time enrollment QR.</p><label>Device ID<input id="deviceId" placeholder="ESPBOARD-A1B2C3"></label><label>Factory enrollment key<input id="factoryKey" type="password"></label><button id="generate">Generate Secure QR</button><p id="status" class="auth-status"></p><p id="error" class="auth-error"></p><div id="result" hidden><h2>Scan / Print</h2><div id="qrcode"></div><p id="details"></p><button id="print" class="secondary">Print QR</button></div></div></section></main><script>
const $=id=>document.getElementById(id);
$("generate").onclick=async()=>{ $("error").textContent="";$("status").textContent="Generating one-time token…";$("result").hidden=true; const deviceId=$("deviceId").value.trim().toUpperCase(),factoryKey=$("factoryKey").value; try{const r=await fetch("/api/enrollment/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deviceId,factoryKey})}),j=await r.json();if(!r.ok)throw new Error(j.error||"Unable to generate enrollment token.");const url=new URL("./index.html",location.href);url.searchParams.set("device",deviceId);url.searchParams.set("enroll",j.token);$("qrcode").innerHTML="";const img=document.createElement("img");img.alt="Secure Plant Life Care device QR";img.width=280;img.height=280;img.src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data="+encodeURIComponent(url.href);$("qrcode").appendChild(img);$("details").textContent="Device "+deviceId+" • One-time token valid for 15 minutes or until claimed.";$("status").textContent="QR generated.";$("result").hidden=false}catch(e){$("error").textContent=e.message;$("status").textContent=""}};
$("print").onclick=()=>window.print();
</script></body></html>
