<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plant Life Care V3 - Device QR</title><link rel="stylesheet" href="./styles.css"></head><body><main class="page"><section class="auth-shell"><div class="auth-card"><p class="eyebrow">Plant Life Care V3</p><h1>Device QR Generator</h1><p class="subtitle">Create a QR that opens customer registration and device claiming for one controller.</p><label>Device ID<input id="deviceId" placeholder="PLANT-A1B2C3" autocomplete="off"></label><button id="make">Generate QR</button><div id="result" class="qr-result" hidden><h2 id="qrTitle"></h2><div id="qr"></div><p id="qrUrl"></p><button onclick="window.print()">Print QR</button></div><p class="auth-error">Development milestone: this QR contains the Device ID. Commercial production should use a one-time enrollment token validated by the backend.</p></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>document.getElementById('make').onclick=()=>{const id=document.getElementById('deviceId').value.trim().toUpperCase();if(!/^PLANT-[A-F0-9]{6}$/.test(id)){alert('Use a Device ID such as PLANT-A1B2C3.');return}const target=new URL('./index.html?device='+encodeURIComponent(id),location.href).href;document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:target,width:260,height:260});document.getElementById('qrTitle').textContent=id;document.getElementById('qrUrl').textContent=target;document.getElementById('result').hidden=false};</script></body></html>
