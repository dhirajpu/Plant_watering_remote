<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Plant Life Care - Super Admin</title><link rel="stylesheet" href="./styles.css"></head><body><main class="page"><section class="auth-shell"><div class="auth-card"><p class="eyebrow">Plant Life Care V3</p><h1>Secure Device QR</h1><p class="subtitle">Super Admin / Manufacturing • Generates a 15-minute, one-time enrollment QR.</p><label>Device ID<input id="deviceId" placeholder="ESPBOARD-A1B2C3"></label><label>Factory enrollment key<input id="factoryKey" type="password"></label><button id="generate">Generate Secure QR</button><p id="status" class="auth-status"></p><p id="countdown" class="auth-status"></p><p id="error" class="auth-error"></p><div id="result" hidden><h2>Scan / Print</h2><div id="qrcode"></div><p id="details"></p><button id="print" class="secondary">Print QR</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const $=id=>document.getElementById(id);
$("generate").onclick=async()=>{ $("error").textContent="";$("status").textContent="Generating one-time token…";$("result").hidden=true; const deviceId=$("deviceId").value.trim().toUpperCase(),factoryKey=$("factoryKey").value; try{const r=await fetch("/api/enrollment/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deviceId,factoryKey})}),j=await r.json();if(!r.ok)throw new Error(j.error||"Unable to generate enrollment token.");const url=new URL("./index.html",location.href);const fragment=new URLSearchParams({device:deviceId,enroll:j.token});url.hash=fragment.toString();$("qrcode").innerHTML="";new QRCode($("qrcode"),{text:url.href,width:280,height:280});$("details").textContent="Device "+deviceId+" • One-time token valid for 15 minutes or until claimed.";$("status").textContent="QR generated successfully.";$("result").hidden=false;const expires=j.expiresAt;const tick=()=>{const left=Math.max(0,expires-Date.now());$("countdown").textContent=left?"QR expires in "+Math.ceil(left/1000)+" seconds.":"QR expired. Generate a new QR.";if(left)setTimeout(tick,1000)};tick()}catch(e){$("error").textContent=e.message;$("status").textContent=""}};
$("print").onclick=()=>window.print();
</script></body></html>
