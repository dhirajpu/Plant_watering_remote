name: Apply watering history NTP timestamp fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-watering-history-timestamp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, 'NTP completion timestamp') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch firmware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Plant_Watering_Smart_V2_OTA.ino')
          s = p.read_text()

          old_version = 'static const char *FIRMWARE_VERSION = "Plant_Watering_Smart_V2_OTA_1.2";'
          new_version = 'static const char *FIRMWARE_VERSION = "Plant_Watering_Smart_V2_OTA_1.3";'
          if old_version not in s:
              raise SystemExit('Expected firmware version 1.2 not found')
          s = s.replace(old_version, new_version, 1)

          old = 'String h="{\\"plantIndex\\":"+String(i)+",\\"plantName\\":\\""+safetyName(plants[i].name)+"\\",\\"durationMs\\":"+String(s.sessionPumpMs)+",\\"reason\\":\\""+stopReasonText(reason)+"\\",\\"moistureStart\\":"+String(s.moistureAtSessionStart)+",\\"moistureEnd\\":"+String(s.moisture)+"}";httpPost("/history/watering",h);'
          new = 'String completionTimestamp=historyTimestamp();unsigned long long completionEpochMs=historyEpochMs();String h="{\\"plantIndex\\":"+String(i)+",\\"plantName\\":\\""+safetyName(plants[i].name)+"\\",\\"durationMs\\":"+String(s.sessionPumpMs)+",\\"reason\\":\\""+stopReasonText(reason)+"\\",\\"moistureStart\\":"+String(s.moistureAtSessionStart)+",\\"moistureEnd\\":"+String(s.moisture)+",\\"timestamp\\":\\""+completionTimestamp+"\\",\\"timestampEpochMs\\":"+String(completionEpochMs)+"}";httpPost("/history/watering",h);'
          if old not in s:
              raise SystemExit('Expected watering history payload not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit firmware change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plant_Watering_Smart_V2_OTA.ino
          git diff --cached --check
          git commit -m "Add NTP completion timestamp to watering history [skip ci]"
          git push
