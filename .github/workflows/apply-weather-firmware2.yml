name: Apply Bengaluru weather firmware v2
on:
  push:
    paths:
      - 'weather-firmware-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/weather_dashboard_patch.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Plant_Watering_Smart_V2_OTA.ino v2/index.html
          git diff --cached --quiet || git commit -m 'feat: add Bengaluru weather and Wi-Fi connectivity awareness'
          git push
